services:
  parceltrack:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-amoszp}/parceltrack:${PARCELTRACK_TAG:-latest}
    container_name: parceltrack
    restart: unless-stopped
    ports:
      - "1109:3000"
    env_file:
      - ./.env
    volumes:
      # Host-side folder that keeps the SQLite database across updates.
      - ./data:/app/data
    networks:
      - default
      - accounts

networks:
  accounts:
    # Created by the accounts service's compose file.
    external: true
